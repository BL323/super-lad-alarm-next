<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lad Alarm" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>Super Lad Alarm</title>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
    </div>
    <div id="rotate" hidden>
      <svg class="rotate-phone" viewBox="0 0 32 32" width="72" height="72" aria-hidden="true">
        <rect x="9" y="3" width="14" height="26" rx="2" fill="none" stroke="#ffcd75" stroke-width="2" />
        <rect x="14" y="25" width="4" height="1.5" fill="#ffcd75" />
      </svg>
      <p class="rotate-title">ROTATE YOUR PHONE</p>
      <p class="rotate-sub">Super Lad Alarm plays in landscape</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
